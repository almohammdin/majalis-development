r:#0B1A2B}.investment-stage-actions .manage{background:#F1F4F7;color:#0B1A2B;border:1px solid #DDE4EA}@media(max-width:760px){.investment-hub-head{align-items:flex-start;flex-direction:column}.investment-hub-grid{grid-template-columns:1fr}.investment-hub-admin{width:100%}}</style><section class="investment-hub"><div class="investment-hub-card"><div class="investment-hub-head"><div class="investment-hub-title"><h2>الاستثمار والجولات التمويلية</h2><p>إدارة العرضين الاستثماريين والوصول إلى الصفحات المستقلة من لوحة تطوير مجالس.</p></div><a class="investment-hub-admin" href="investment-admin.html">فتح لوحة التحكم الاستثمارية</a></div><div class="investment-hub-grid"><article class="investment-stage"><div class="investment-stage-top"><div><h3>مرحلة ما قبل البذرة</h3><small>Pre-Seed</small></div><div class="investment-amount"><span>375,000</span><img class="sar-symbol" src="https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg" alt="رمز الريال السعودي"><span>· 5%</span></div></div><div class="investment-stage-actions"><a class="view" href="pre-seed.html">عرض الصفحة المستقلة</a><a class="manage" href="investment-admin.html">إدارة البيانات</a></div></article><article class="investment-stage"><div class="investment-stage-top"><div><h3>مرحلة البذرة</h3><small>Seed</small></div><div class="investment-amount"><span>8,000,000</span><img class="sar-symbol" src="https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg" alt="رمز الريال السعودي"><span>· 21.05%</span></div></div><div class="investment-stage-actions"><a class="view" href="investment.html">عرض الصفحة المستقلة</a><a class="manage" href="investment-admin.html">إدارة البيانات</a></div></article></div></div></section><!-- INVESTMENT-SECTION-END -->`;if(h.includes('<div class="notice">'))h=h.replace('<div class="notice">',block+'<div class="notice">');else h=h.replace('</header>','</header>'+block);document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div c
