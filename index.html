<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0B1A2B" />
    <title>لوحة تطوير منصة مجالس</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f2f5f7;
        font-family: Arial, sans-serif;
      }
      .loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #0b1a2b;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="loading">جاري فتح لوحة تطوير مجالس...</div>
    <script>
      (async () => {
        try {
          let h = await (
            await fetch("dashboard-core.html?v=1", { cache: "no-store" })
          ).text();
          const block = `<!-- INVESTMENT-SECTION-START --><style id="investment-hub-style">.investment-hub{max-width:1380px;margin:0 auto 15px;padding:0 18px;position:relative;z-index:4}.investment-hub-card{background:linear-gradient(145deg,#fff,#fbfcfd);border:1px solid rgba(11,26,43,.09);border-radius:18px;padding:18px;box-shadow:0 14px 40px rgba(11,26,43,.085)}.investment-hub-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.investment-hub-title h2{margin:0;color:#0B1A2B;font-size:21px}.investment-hub-title p{margin:3px 0 0;color:#667487;font-size:11px}.investment-hub-admin{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 13px;border-radius:11px;text-decoration:none;font-size:11px;font-weight:900;background:#0B1A2B;color:#fff}.investment-hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.investment-stage{border:1px solid #DDE4EA;border-radius:15px;padding:15px;background:#fff;display:grid;gap:10px}.investment-stage.featured{border-color:#D8C47F;background:linear-gradient(145deg,#fffdf7,#fff)}.investment-stage-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.investment-stage h3{margin:0;color:#0B1A2B;font-size:16px}.investment-stage small{display:block;color:#667487;font-size:9px;margin-top:2px}.investment-amount{font-size:20px;font-weight:900;color:#0B1A2B;direction:ltr;text-align:right;display:inline-flex;align-items:center;gap:.28em}.investment-amount .sar-symbol{height:.78em;width:auto;display:inline-block;order:-1}.investment-stage-actions{display:flex;gap:7px;flex-wrap:wrap}.investment-stage-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 11px;border-radius:10px;text-decoration:none;font-size:10px;font-weight:900}.investment-stage-actions .view{background:#C9A84C;color:#0B1A2B}.investment-stage-actions .manage{background:#F1F4F7;color:#0B1A2B;border:1px solid #DDE4EA}@media(max-width:900px){.investment-hub-grid{grid-template-columns:1fr}.investment-hub-head{align-items:flex-start;flex-direction:column}.investment-hub-admin{width:100%}}</style><section class="investment-hub"><div class="investment-hub-card"><div class="investment-hub-head"><div class="investment-hub-title"><h2>الاستثمار والجولات التمويلية</h2><p>مذكرة المشروع الشاملة وصفحتان مستقلتان لكل مرحلة تمويلية.</p></div><a class="investment-hub-admin" href="investment-admin.html">فتح لوحة التحكم الاستثمارية</a></div><div class="investment-hub-grid"><article class="investment-stage featured"><div class="investment-stage-top"><div><h3>المذكرة الاستثمارية ودراسة الجدوى</h3><small>المشروع والسوق والمنافسون والنمو والتكاليف</small></div></div><div class="investment-stage-actions"><a class="view" href="investment-memo.html">فتح المذكرة الشاملة</a></div></article><article class="investment-stage"><div class="investment-stage-top"><div><h3>مرحلة ما قبل البذرة</h3><small>Pre-Seed</small></div><div class="investment-amount"><img class="sar-symbol" src="https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg" alt="رمز الريال السعودي"><span>375,000</span><span>· %5</span></div></div><div class="investment-stage-actions"><a class="view" href="pre-seed.html">عرض الصفحة المستقلة</a><a class="manage" href="investment-admin.html">إدارة البيانات</a></div></article><article class="investment-stage"><div class="investment-stage-top"><div><h3>مرحلة البذرة</h3><small>Seed</small></div><div class="investment-amount"><img class="sar-symbol" src="https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg" alt="رمز الريال السعودي"><span>8,000,000</span><span>· %21.05</span></div></div><div class="investment-stage-actions"><a class="view" href="investment.html">عرض الصفحة المستقلة</a><a class="manage" href="investment-admin.html">إدارة البيانات</a></div></article></div></div></section><!-- INVESTMENT-SECTION-END -->`;
          const strategyBlock = `<!-- STRATEGY-SECTION-START --><style id="strategy-hub-style">.strategy-hub{max-width:1380px;margin:0 auto 15px;padding:0 18px;position:relative;z-index:4}.strategy-hub-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:radial-gradient(circle at 8% 18%,rgba(201,168,76,.18),transparent 27%),linear-gradient(145deg,#0B1A2B,#173B5A);border:1px solid rgba(201,168,76,.34);border-radius:18px;padding:20px;box-shadow:0 14px 40px rgba(11,26,43,.14);color:#fff}.strategy-hub-card:after{content:"";position:absolute;inset:0;opacity:.1;background-image:linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}.strategy-hub-copy,.strategy-hub-action{position:relative;z-index:1}.strategy-hub-kicker{display:inline-flex;padding:4px 9px;border-radius:999px;background:rgba(201,168,76,.16);border:1px solid rgba(234,213,141,.35);color:#EAD58D;font-size:9px;font-weight:900}.strategy-hub h2{margin:7px 0 3px;font-size:23px;color:#fff}.strategy-hub p{margin:0;max-width:850px;color:rgba(255,255,255,.72);font-size:11px}.strategy-hub-action{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:9px 15px;border-radius:11px;background:#C9A84C;color:#0B1A2B;text-decoration:none;font-size:11px;font-weight:900;white-space:nowrap}@media(max-width:760px){.strategy-hub-card{grid-template-columns:1fr}.strategy-hub-action{width:100%}}</style><section class="strategy-hub"><div class="strategy-hub-card"><div class="strategy-hub-copy"><span class="strategy-hub-kicker">ملف تابع لتطوير مجالس</span><h2>استراتيجية مجالس</h2><p>التموضع وخيارات الفوز وسلم المنتج والمنافسون والتكاملات والشراكات، مع استراتيجية التصديق الرقمي وخارطة الترخيص والتنفيذ.</p></div><a class="strategy-hub-action" href="strategy.html">فتح استراتيجية مجالس</a></div></section><!-- STRATEGY-SECTION-END -->`;
          if (h.includes('<div class="notice">'))
            h = h.replace(
              '<div class="notice">',
              strategyBlock + block + '<div class="notice">',
            );
          else h = h.replace("</header>", "</header>" + strategyBlock + block);
          document.open();
          document.write(h);
          document.close();
        } catch (e) {
          document.body.innerHTML =
            '<div class="loading">تعذر فتح لوحة التطوير. أعد تحميل الصفحة.</div>';
        }
      })();
    </script>
  </body>
</html>
