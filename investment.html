<script>
(async()=>{
 try{

  const fav='<link rel="icon" href="https://almohammdin.github.io/majalis/majalis-favicon.ico?v=20260719-3" sizes="any"><link rel="shortcut icon" href="https://almohammdin.github.io/majalis/majalis-favicon.ico?v=20260719-3" type="image/x-icon"><link rel="icon" type="image/png" sizes="32x32" href="https://almohammdin.github.io/majalis/majalis-favicon-32.png?v=20260719-3"><link rel="icon" type="image/png" sizes="192x192" href="https://almohammdin.github.io/majalis/majalis-favicon-192.png?v=20260719-3"><link rel="apple-touch-icon" sizes="180x180" href="https://almohammdin.github.io/majalis/majalis-apple-touch-icon.png?v=20260719-3">';
  const fix=`<style id="investment-visual-fixes">
  .sar{direction:ltr!important;unicode-bidi:isolate;display:inline-flex!important;align-items:center;gap:.24em}.sar img{order:-1;display:inline-block;mix-blend-mode:normal!important;opacity:1!important;filter:brightness(0) saturate(100%) invert(9%) sepia(23%) saturate(1508%) hue-rotate(169deg) brightness(93%) contrast(96%)!important}.hero .sar img,.ask .sar img{filter:brightness(0) invert(1)!important}.hero .ri small .sar img{filter:brightness(0) saturate(100%) invert(84%) sepia(28%) saturate(696%) hue-rotate(3deg) brightness(102%) contrast(90%)!important}.pct{direction:ltr;unicode-bidi:isolate;display:inline-block}.gauge{background:linear-gradient(90deg,#2a8b61 0 25%,#94b84a 25% 45%,#e2b641 45% 65%,#d9832e 65% 82%,#b04444 82% 100%)!important}.project-links{max-width:1240px;margin:12px auto 0;padding:0 18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.project-links a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 11px;border-radius:999px;text-decoration:none;font-size:9px;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08)}.project-links a:hover{background:rgba(255,255,255,.14);border-color:rgba(234,213,141,.65)}.seed-note{margin:18px auto 0;max-width:1240px;padding:0 18px}.seed-note-inner{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:15px}.seed-note h2{margin:0 0 4px;color:#fff;font-size:17px}.seed-note p{margin:0;color:rgba(255,255,255,.76);font-size:10px}.seed-effect{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.seed-effect div{background:rgba(255,255,255,.07);border-radius:12px;padding:11px}.seed-effect span{display:block;color:rgba(255,255,255,.62);font-size:8px}.seed-effect b{display:block;color:#fff;font-size:16px;margin-top:2px}@media(max-width:700px){.seed-effect{grid-template-columns:repeat(2,1fr)}}
  </style>`;
  h=h.replace('الاتجاه العربي يبدأ من اليمين بالأخضر ويتدرج نحو اليسار بالأحمر.','الاتجاه العربي يبدأ من اليمين بالمخاطر الأعلى، ويتدرج نحو اليسار إلى الجاهزية الأعلى والمخاطر الأقل.');
  const links=`<div class="project-links" aria-label="منتجات مشروع مجالس"><a href="https://almohammdin.github.io/majalis/" target="_blank" rel="noopener">منصة مجالس</a><a href="https://almohammdin.github.io/majalis-evaluator/" target="_blank" rel="noopener">مقيم مجالس</a><a href="https://almohammdin.github.io/Board-Case/" target="_blank" rel="noopener">الدراسات والأبحاث</a></div>`;
  const note=`<div class="seed-note"><div class="seed-note-inner"><h2>مرحلة البذرة</h2><p>تمويل توسع بعد إثبات المنتج، يوجّه لبناء الفريق والمبيعات وزيادة الإيراد استعدادا للجولة التالية.</p><div class="seed-effect"><div><span>مبلغ الجولة</span><b class="sar">8,000,000 <img src="https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg" alt="رمز الريال السعودي"></b></div><div><span>حصة المستثمرين</span><b class="pct">%21.05</b></div><div><span>العملاء المستهدفون</span><b>60</b></div><div><span>الإيراد السنوي المتكرر المستهدف</span><b class="sar">4,000,000 <img src="https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg" alt="رمز الريال السعودي"></b></div></div></div></div>`;
  h=h.replace('</header><div class="dash">',links+note+'</header><div class="dash">');
  h=h.replace('</head>',fav+fix+'</head>');
  const normalize=`<script>(()=>{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const n=[];while(w.nextNode())n.push(w.currentNode);n.forEach(x=>{if(x.parentElement&&['STYLE','SCRIPT'].includes(x.parentElement.tagName))return;x.nodeValue=x.nodeValue.replace(/(\\d+(?:\\.\\d{1,2})?)%/g,'%$1')});document.querySelectorAll('.sar').forEach(el=>{el.setAttribute('dir','ltr');const img=el.querySelector('img');if(img)el.prepend(img)});})();<\/script>`;
  h=h.replace('</body>',normalize+'</body>');
  document.open();document.write(h);document.close();
 }catch(e){document.body.innerHTML='<div class="loading">تعذر فتح الصفحة. أعد تحميلها.</div>'}
})();
</script>
