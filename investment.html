<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a31">
<title>الملف الاستثماري | منصة مجالس</title>
<style>html,body{margin:0;min-height:100%;background:#f2f5f8;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#071a31;font-weight:700}</style>
</head>
<body>
<div class="loading">جاري فتح الملف الاستثماري...</div>
<script>
(async()=>{
 try{
  let h=await(await fetch('https://raw.githubusercontent.com/almohammdin/majalis-development/21fbffbbc95d6600f2c76ce6d735411757d0a1e1/investment.html',{cache:'no-store'})).text();
  const fix=`<style id="sar-color-fix">
  .sar img{display:inline-block;mix-blend-mode:normal!important;opacity:1!important;filter:brightness(0) saturate(100%) invert(9%) sepia(23%) saturate(1508%) hue-rotate(169deg) brightness(93%) contrast(96%)!important}
  .hero .sar img,.ask .sar img{filter:brightness(0) invert(1)!important}
  .hero .ri small .sar img{filter:brightness(0) saturate(100%) invert(84%) sepia(28%) saturate(696%) hue-rotate(3deg) brightness(102%) contrast(90%)!important}
  </style>`;
  h=h.replace('</head>',fix+'</head>');
  document.open();document.write(h);document.close();
 }catch(e){document.body.innerHTML='<div class="loading">تعذر فتح الصفحة. أعد تحميلها.</div>'}
})();
</script>
</body>
</html>
