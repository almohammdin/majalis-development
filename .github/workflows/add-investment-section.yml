name: Add investment section

on:
  push:
    paths:
      - '.github/workflows/add-investment-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add investment section to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="investmentRoundsSection"'
          if marker not in s:
              css = '''
.investment-hub{max-width:1380px;margin:-20px auto 16px;padding:0 18px;position:relative;z-index:4}
.investment-hub-inner{background:linear-gradient(145deg,#0B1A2B,#15324F);color:#fff;border:1px solid rgba(201,168,76,.38);border-radius:18px;padding:18px;box-shadow:0 16px 42px rgba(11,26,43,.16)}
.investment-hub-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:13px}
.investment-hub-head h2{margin:0;font-size:19px;color:#fff}.investment-hub-head p{margin:2px 0 0;color:rgba(255,255,255,.68);font-size:10px}
.investment-links{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px}
.investment-link{display:block;text-decoration:none;border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;transition:.2s}
.investment-link:hover{transform:translateY(-2px);background:rgba(255,255,255,.11);border-color:rgba(201,168,76,.55)}
.investment-link.admin{background:linear-gradient(135deg,#C9A84C,#E0C46F);color:#0B1A2B;border-color:#EAD58D}
.investment-link span{display:block;font-size:9px;opacity:.72}.investment-link b{display:block;font-size:14px;margin:3px 0}.investment-link small{display:block;font-size:9px;opacity:.8}
@media(max-width:800px){.investment-links{grid-template-columns:1fr}.investment-hub-head{align-items:flex-start;flex-direction:column}}
'''
              s = s.replace('</style>', css + '</style>', 1)
              block = '''
<section class="investment-hub" id="investmentRoundsSection">
  <div class="investment-hub-inner">
    <div class="investment-hub-head">
      <div><h2>الاستثمار والجولات التمويلية</h2><p>إدارة العروض الاستثمارية وفتح الصفحات المستقلة للمشاركة.</p></div>
    </div>
    <div class="investment-links">
      <a class="investment-link admin" href="investment-admin.html"><span>إدارة داخلية</span><b>لوحة التحكم الاستثمارية</b><small>تعديل الأرقام والنسب ونشرها مباشرة</small></a>
      <a class="investment-link" href="pre-seed.html"><span>رابط مستقل</span><b>مرحلة ما قبل البذرة</b><small>375,000 ريال مقابل 5%</small></a>
      <a class="investment-link" href="investment.html"><span>رابط مستقل</span><b>مرحلة البذرة</b><small>8,000,000 ريال مقابل 21.05%</small></a>
    </div>
  </div>
</section>
'''
              if '</header>' in s:
                  s = s.replace('</header>', '</header>' + block, 1)
              elif '<div class="notice">' in s:
                  s = s.replace('<div class="notice">', block + '<div class="notice">', 1)
              else:
                  s = s.replace('<body>', '<body>' + block, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate investment rounds into development dashboard"
            git push
          fi
